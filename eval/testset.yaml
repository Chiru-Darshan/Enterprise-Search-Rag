# Golden evaluation set for the Agentic RAG pipeline.
#
# Each entry:
#   query:          the question to ask
#   expected_urls:  source doc URL(s) that should appear in retrieval results
#                   (any one match counts as "relevant" for that query)
#   expect_answer:  if false, this query is expected to have NO good answer in the
#                   corpus (used to test that the system says "I don't know" instead
#                   of hallucinating) - omit/true for normal queries
#
# Extend this list as the corpus grows; keep it representative of real user questions,
# not just titles copy-pasted from the docs.

- query: What is A/B Testing in SearchUnify?
  expected_urls:
    - https://docs.searchunify.com/Content/AB_Test/A-B_Test.htm
    - https://docs.searchunify.com/Content/AB_Test/A-B-Test-Conceptual.htm

